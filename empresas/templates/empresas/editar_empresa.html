<!DOCTYPE html>
<html>
<head>
    <title>Editar Empresa</title>
</head>
<body>
    <h1>Editar Empresa: {{ empresa.nombre }}</h1>
    
    <form method="post">
        {% csrf_token %}
        
        {{ form.as_p }}
        
        <button type="submit">Actualizar Empresa</button>
    </form>
    
    <br>
    <a href="{% url 'empresas:lista_empresas' %}">Volver a la lista</a>
</body>
</html>
