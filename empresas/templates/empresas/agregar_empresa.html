<!DOCTYPE html>
<html>
<head>
    <title>Agregar Empresa</title>
</head>
<body>
    <h1>Agregar Nueva Empresa</h1>

    <a href="{% url 'empresas:lista_empresas' %}">Volver a la lista</a>
</body>
</html>
