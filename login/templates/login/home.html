{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesion</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container d-flex justify-content-center align-items-center flex-column min-vh-100">
    <div class="card p-4 shadow" style="width: 100%; max-width: 400px;">
      <h3 class="text-center mb-4">Bienvenido a RUMITEC</h3>
      <img src="{% static 'login/logo-rumitec.jpg' %}" alt="Logo" class="mb-4 mx-auto d-block" style="max-width: 250px;"> 
      
    <div class="d-flex justify-content-center">          
      <a href="{% url 'login:login' %}" class="btn btn-info btn-lg px-4 rounded-pill fw-bold text-white">Iniciar sesión</a>
    </div>
    
</div>


 <!-------------- Modal de mensaje ------------->
  <div class="modal fade" id="mensajeModal" tabindex="-1" aria-labelledby="mensajeModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" style="max-width: 1000px;">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title fs-6" id="mensajeModalLabel">Correo registrado</h5>
        </div>
        <div class="modal-body">
          <p id="contenidoMensaje"></p>
        </div>
      </div>
    </div>
  </div>
{% if messages %} 
<script>
    document.addEventListener('DOMContentLoaded', function () {
      const mensaje = `{% for message in messages %}{{ message|escapejs }}{% endfor %}`;
      
      const correo= "{{user.email}}";
      const mensajeConfirmacion='Correo ${correo} confirmado';
      const modal = new bootstrap.Modal(document.getElementById('mensajeModal'));
      document.getElementById('contenidoMensaje').innerText = mensaje;
      modal.show();
      setTimeout(() => modal.hide(), 5000);
      
    });
</script>
{% endif %}  
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
