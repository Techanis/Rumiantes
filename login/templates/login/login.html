{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesion</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container d-flex justify-content-center align-items-center flex-column min-vh-100">

    <!-- Imagen superior -->
   

    <div class="card p-4 shadow" style="width: 100%; max-width: 400px;">
      <h3 class="text-center mb-4">Bienvenido a Rumitec</h3>

      <img src="{% static 'login/logo-rumitec.jpg' %}" alt="Logo" class="mb-4 mx-auto d-block" style="max-width: 250px;"> 

      <form method="POST">
        {% csrf_token %}
        <div class="mb-3">
          <label for="email" class="form-label">Correo electrónico</label>
          <input type="email" class="form-control" id="email" name="email" placeholder="Ingresa tu correo">
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Contraseña</label>
          <input type="password" class="form-control" id="password" name="password" placeholder="Ingresa tu contraseña">
        </div>
        <div class="d-flex justify-content-between align-items-center mb-3">
          <a href="#" class="small text-decoration-none" data-bs-toggle="modal" data-bs-target="#recuperarClaveModal">¿Olvidaste tu contraseña?</a>
        </div>
        <div class="d-flex justify-content-center">
          <button type="submit" class="btn btn-info btn-lg px-4 rounded-pill fw-bold text-white">Iniciar sesión</button>
        </div>
      </form>
    </div>
    <!-- Modal para recuperación de contraseña -->
<div class="modal fade" id="recuperarClaveModal" tabindex="-1" aria-labelledby="recuperarClaveModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <form method="POST" action="{% url 'login:password_reset' %}">
        {% csrf_token %}
        <div class="modal-header">
          <h5 class="modal-title" id="recuperarClaveModalLabel">Recuperar contraseña</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <p>Ingrese su correo electrónico para enviarle un enlace y poder cambiar su clave.</p>
          <input type="email" class="form-control" name="email" placeholder="Correo electrónico" required>
        </div>
        <div class="modal-footer">
          <button type="submit" class="btn btn-primary">Enviar</button>
        </div>
      </form>
    </div>
  </div>
</div>

</div>


 <!-------------- Modal de mensaje ------------->
  <div class="modal fade" id="mensajeModal" tabindex="-1" aria-labelledby="mensajeModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" style="max-width: 1000px;">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title fs-6" id="mensajeModalLabel">Correo registrado</h5>
        </div>
        <div class="modal-body">
          <p id="contenidoMensaje"></p>
        </div>
      </div>
    </div>
  </div>
{% if messages %} 
<script>
    document.addEventListener('DOMContentLoaded', function () {
      const mensaje = `{% for message in messages %}{{ message|escapejs }}{% endfor %}`;
      
      const correo= "{{user.email}}";
      const mensajeConfirmacion='Correo ${correo} confirmado';
      const modal = new bootstrap.Modal(document.getElementById('mensajeModal'));
      document.getElementById('contenidoMensaje').innerText = mensaje;
      modal.show();
      setTimeout(() => modal.hide(), 5000);
      
    });
</script>
{% endif %}  
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
